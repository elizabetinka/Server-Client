name: C++ CI/CD

on:
  push:
    branches: ["**"]
    tags:
      - "v*"
  pull_request:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build --config Release

      - name: Run tests
        working-directory: build
        run: ctest --output-on-failure -C Release

      # ---------- Linux ----------
      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          mkdir package
          find build -maxdepth 1 -type f -executable -exec cp {} package/ \;
          zip -r Server-Client-linux.zip package

      # ---------- macOS ----------
      - name: Package macOS
        if: runner.os == 'macOS'
        run: |
          mkdir package
          find build -maxdepth 1 -type f -perm -111 -exec cp {} package/ \;
          zip -r Server-Client-macos.zip package

      # ---------- Windows ----------
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item package -ItemType Directory
          Get-ChildItem build -Filter *.exe | Copy-Item -Destination package
          Compress-Archive package Server-Client-windows.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ runner.os }}
          path: |
            *.zip

      - name: Upload Release Assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.zip